name: Build desktop release
run-name: Desktop release from ${{ github.ref_name }} (${{ github.sha }})

on:
  push:
    branches: [master]
  workflow_dispatch:

# Keep complete workflows separate while allowing the platform jobs to overlap.
concurrency:
  group: rabbitlands-desktop-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHONUTF8: '1'
  PIP_NO_CACHE_DIR: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  prepare:
    if: github.repository == 'rabbitlandsgame/rabbitlands-client'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.draft.outputs.commit }}
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: godot-client/tools
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Find or create the client draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY_AVAILABLE: ${{ secrets.CLIENT_UPDATE_SIGNING_KEY != '' }}
        run: python godot-client/tools/actions_release.py prepare

  build:
    needs: prepare
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2025
          - platform: linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: godot-client/tools
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install Python build dependencies
        run: python -m pip install --requirement godot-client/tools/runner-requirements.txt
      - name: Install native Linux libraries
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libfontconfig1 libx11-6 libxcursor1 libxinerama1 libxi6 libxrandr2 libasound2t64 libgl1
      - name: Identify committed asset and tool inputs
        id: asset-key
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: python godot-client/tools/actions_release.py cache-key --platform "$RELEASE_PLATFORM"
      - name: Restore verified asset build products
        id: assets
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rabbitlands-asset-cache/${{ matrix.platform }}
          key: ${{ steps.asset-key.outputs.key }}
      - name: Build, sign, and upload verified download parts
        env:
          GH_TOKEN: ${{ github.token }}
          CLIENT_UPDATE_SIGNING_KEY: ${{ secrets.CLIENT_UPDATE_SIGNING_KEY }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: python godot-client/tools/actions_release.py build --platform "$RELEASE_PLATFORM" --release-id "$RELEASE_ID"
      - name: Retain prepared assets for code-only builds
        if: steps.assets.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/rabbitlands-asset-cache/${{ matrix.platform }}
          key: ${{ steps.asset-key.outputs.key }}
      - name: Transfer the small platform receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-${{ matrix.platform }}
          path: ${{ runner.temp }}/rabbitlands-releases/runner-${{ matrix.platform }}-${{ needs.prepare.outputs.commit }}/${{ matrix.platform }}-runner.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain disk measurements and startup diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/rabbitlands-releases/runner-*/disk-usage.json
            ${{ runner.temp }}/rabbitlands-releases/runner-*/downloads/.build/logs/*/smoke.log
            ${{ runner.temp }}/rabbitlands-releases/runner-*/downloads/.build/logs/*/vram-textures.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  finalize:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: godot-client/tools
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runner-*
          path: ${{ runner.temp }}/receipts
          merge-multiple: true
      - name: Verify both platforms and replace the current draft downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TEMP: ${{ runner.temp }}
        run: |
          python godot-client/tools/finalize_runner_release.py --windows "$RELEASE_TEMP/receipts/windows-runner.json" --linux "$RELEASE_TEMP/receipts/linux-runner.json" --out "$RELEASE_TEMP/final-release"
          cat "$RELEASE_TEMP/final-release/RELEASE-NOTES.md" >> "$GITHUB_STEP_SUMMARY"
          printf '\nBoth platforms are verified. The publishing job will make this release public.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Retain release verification and the optional server policy
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-verification
          path: ${{ runner.temp }}/final-release/*
          retention-days: 7

  publish:
    needs: [prepare, finalize]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: godot-client/tools
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-verification
          path: ${{ runner.temp }}/verified-release
      - name: Publish the verified release and retire previous downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TEMP: ${{ runner.temp }}
        run: python godot-client/tools/publish_runner_release.py --receipt "$RELEASE_TEMP/verified-release/runner-release.json"
