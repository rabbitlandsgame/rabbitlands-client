name: Repoint the desktop live channel (rollback)
run-name: Desktop repoint from ${{ github.ref_name }} (${{ github.sha }})

# A deliberate rollback to a retained, published release whose manifests are
# schema 3 (the helper-train release T or later). The rollback pointers (with
# a higher sequence) are signed before any write; GitHub latest moves first,
# then the pointers are uploaded to the target release; the owner then puts
# them live on R2 from the build machine
# (upload_desktop_assets.py publish --rollback). Never recreate, re-publish or
# re-tag an old client-<sha> release. No job holds an R2 credential.
on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: Commit of the retained, published release to roll back to (40 hex)
        type: string
        required: true
      platforms:
        description: Platforms to repoint
        type: choice
        options: [both, windows, linux]
        default: both

concurrency:
  group: rabbitlands-desktop-release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  PIP_NO_CACHE_DIR: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  check:
    name: Check the rollback target
    if: github.repository == 'rabbitlandsgame/rabbitlands-client'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /godot-client/tools/
            /godot-client/data/update_public.pem
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install the hash-locked signing dependencies
        run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: --requirement godot-client/tools/desktop-sign-requirements.txt
      - name: Check the target release and every download it names, before any approval
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          REPOINT_PLATFORMS: ${{ inputs.platforms }}
        run: python godot-client/tools/actions_release.py repoint-check --out "$RUNNER_TEMP/repoint"

  repoint:
    name: Repoint (sign the rollback pointers, move GitHub latest, then upload them)
    needs: check
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: desktop-publish
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /godot-client/tools/
            /godot-client/data/update_public.pem
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install the hash-locked signing dependencies
        run: |
          python -m pip install --require-hashes --no-deps --only-binary=:all: --requirement godot-client/tools/desktop-sign-requirements.txt
      - name: Check the target again after approval
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          REPOINT_PLATFORMS: ${{ inputs.platforms }}
        run: python godot-client/tools/actions_release.py repoint-check --out "$RUNNER_TEMP/repoint"
      # Sign both pointers before any write: a missing or wrong key fails here,
      # before GitHub latest moves. Publication stays GitHub first (upload checks it).
      - name: Sign the Windows rollback pointer
        if: steps.check.outputs.windows == 'true'
        env:
          CLIENT_UPDATE_SIGNING_KEY: ${{ secrets.CLIENT_UPDATE_SIGNING_KEY }}
          TARGET_RELEASE_ID: ${{ steps.check.outputs.release_id }}
        run: python godot-client/tools/desktop_release_ci.py pointer --platform windows --commit "$GITHUB_SHA" --manifest "$RUNNER_TEMP/repoint/windows-manifest.json" --release-id "$TARGET_RELEASE_ID" --run-id "$GITHUB_RUN_ID" --rollback --out "$RUNNER_TEMP/pointers"
      - name: Sign the Linux rollback pointer
        if: steps.check.outputs.linux == 'true'
        env:
          CLIENT_UPDATE_SIGNING_KEY: ${{ secrets.CLIENT_UPDATE_SIGNING_KEY }}
          TARGET_RELEASE_ID: ${{ steps.check.outputs.release_id }}
        run: python godot-client/tools/desktop_release_ci.py pointer --platform linux --commit "$GITHUB_SHA" --manifest "$RUNNER_TEMP/repoint/linux-manifest.json" --release-id "$TARGET_RELEASE_ID" --run-id "$GITHUB_RUN_ID" --rollback --out "$RUNNER_TEMP/pointers"
      - name: Make the target GitHub latest first
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          REPOINT_PLATFORMS: ${{ inputs.platforms }}
        run: python godot-client/tools/actions_release.py repoint-latest --check "$RUNNER_TEMP/repoint"
      - name: Upload the rollback pointers to the target release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
          REPOINT_PLATFORMS: ${{ inputs.platforms }}
        run: python godot-client/tools/actions_release.py repoint-upload --check "$RUNNER_TEMP/repoint" --pointers "$RUNNER_TEMP/pointers"
