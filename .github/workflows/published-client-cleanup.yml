# No-op since R2 delivery (R2-A7). Pruning moved into the promote job of
# desktop-release-r2.yml, which keeps whole releases for rollback
# (prune_published_release.RETENTION_SCHEMA 2). This file no longer reacts to
# release events and prunes nothing. Release events run the workflow file of
# the released tag, so older tags still carry the old pruner: keep this
# workflow disabled in the Actions UI, and never recreate or re-publish an old
# client-<sha> release.
name: Retire previous published client (no-op)
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: rabbitlands-desktop-release
  cancel-in-progress: false
jobs:
  noop:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Prune nothing
        run: echo "::notice::Pruning runs only in the promote job of desktop-release-r2.yml; this workflow prunes nothing."
